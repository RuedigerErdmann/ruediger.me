<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rüdiger</title>
  <meta name="description" content="Persönliche Website von Rüdiger">
  <style>
    :root { --bg: #fafaf8; --fg: #1d1d1f; --muted: #6e6e73; --accent: #2f6fdb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141416; --fg: #f2f2f4; --muted: #9a9aa0; --accent: #6ea0ff; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 16px; line-height: 1.5;
    }
    main { max-width: 36rem; }
    h1 { font-size: clamp(2.2rem, 7vw, 3.5rem); margin: 0 0 .5rem; letter-spacing: -.02em; }
    p { color: var(--muted); font-size: 1.15rem; margin: 0 0 1.5rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 3rem; font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Hallo, ich bin Rüdiger.</h1>
    <p>Willkommen auf meiner Website. Hier entsteht bald mehr.</p>
    <a href="https://github.com/RuedigerErdmann">GitHub →</a>
    <footer>© 2026 ruediger.me</footer>
  </main>
</body>
</html>
