<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ruediger.me</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1d1d1f; --muted: #6e6e73; --accent: #2f6fde; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111113; --fg: #f2f2f2; --muted: #9a9aa0; --accent: #7aa7ff; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    main { max-width: 560px; text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 .5rem; letter-spacing: -.02em; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); font-size: 1.1rem; line-height: 1.6; margin: 0; }
    footer { margin-top: 2.5rem; font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>ruediger<span>.me</span></h1>
    <p>Hier entsteht bald etwas Neues.</p>
    <footer>&copy; 2026 Rüdiger Erdmann</footer>
  </main>
</body>
</html>
